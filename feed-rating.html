<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Feed rating</title>
  <style>
    body { margin: 0; min-height: 100vh; color: #f5f8ff;
      font: 1.05rem/1.45 ui-sans-serif, system-ui, sans-serif;
      background: linear-gradient(145deg, #10122b, #251839); }
    .fr-wrap { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 1.6rem; letter-spacing: .04em; margin: 0 0 .35rem; }
    .fr-note { margin: 0; color: rgba(239, 244, 255, .75); }
    .fr-list { list-style: none; padding: 0; margin: 1.25rem 0 0; }
    .fr-row { display: grid; grid-template-columns: 2rem 6.2rem 7.4rem 1fr; gap: .3rem .7rem;
      align-items: baseline; border-top: 1px solid rgba(218, 244, 255, .28); padding: .75rem 0; }
    .fr-body { grid-column: 1 / -1; }
    .fr-kind { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: #e8b4ff; }
    .fr-likes, .fr-rank { font-variant-numeric: tabular-nums; }
    .fr-likes { color: #ffd7a8; }
  </style>
</head>
<body>
  <main id="main" class="fr-wrap">
    <h1>Feed rating</h1>
    <p class="fr-note" data-feed-rating-status>Bot desk. Every personal and professional Feed post, ranked by likes. Cognation Times takes the top. Not a public page.</p>
    <ol class="fr-list" data-feed-rating-list></ol>
  </main>
  <script src="js/cognation-config.js"></script>
  <script src="/runtime-config"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/age-floor-keywords.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/feed-rating.js"></script>
</body>
</html>
