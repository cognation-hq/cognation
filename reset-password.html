<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset your Cognation password</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><span data-brand>COGNATION</span></a>
    </div>
  </header>
  <main id="main" class="container" style="max-width:28rem;padding:2rem 1rem">
    <h1>Reset your password</h1>

    <form data-reset-request novalidate>
      <p>Enter the email you use for Cognation. If it has an account, we'll email you a link to set a new password.</p>
      <div class="form-group">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" name="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>

    <form data-reset-set novalidate hidden>
      <p>Choose a new password (at least 8 characters).</p>
      <div class="form-group">
        <label for="reset-new">New password</label>
        <input type="password" id="reset-new" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="form-group">
        <label for="reset-confirm">Confirm new password</label>
        <input type="password" id="reset-confirm" name="confirm" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary">Save new password</button>
    </form>

    <p data-reset-status role="status" aria-live="polite"></p>
    <p><a href="/">Back to sign in</a></p>
  </main>
  <script src="/js/cognation-config.js"></script>
  <script src="/runtime-config"></script>
  <script src="/js/password-reset.js"></script>
</body>
</html>
